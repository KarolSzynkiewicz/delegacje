server {
    # Railway uses PORT environment variable - will be replaced by entrypoint
    listen 0.0.0.0:__PORT__;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    access_log /dev/stdout;
    error_log /dev/stderr;

    charset utf-8;
    
    # Increase body size for file uploads
    client_max_body_size 100M;

    # Serve static files directly (much faster than through PHP)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Storage files (user uploads)
    location /storage {
        alias /var/www/html/storage/app/public;
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Main location - try files, then pass to PHP
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP files - pass to PHP-FPM via unix socket
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        
        # Security headers
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param REQUEST_SCHEME $scheme;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Healthcheck endpoint
    location /api/health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
